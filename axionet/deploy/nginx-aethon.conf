# Example nginx site config for aethon.tech
# Install: sudo cp deploy/nginx-aethon.conf /etc/nginx/sites-available/aethon
#          sudo ln -sf /etc/nginx/sites-available/aethon /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name aethon.tech www.aethon.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aethon.tech www.aethon.tech;

    # ssl_certificate /etc/letsencrypt/live/aethon.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aethon.tech/privkey.pem;

    root /var/www/aethon/frontend/dist;
    index index.html;

    # API + WebSocket â†’ Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA: Google OAuth returns to /auth/callback â€” must serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
